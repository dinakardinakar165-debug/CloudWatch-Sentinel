services:
  # Render Web Service (FastAPI Backend)
  - type: web
    name: cloudwatch-sentinel-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_PATH
        value: "sentinel.db"
      - key: AWS_DEFAULT_REGION
        value: "us-east-1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cloudwatch-sentinel-ui
          envVarKey: RENDER_EXTERNAL_URL

  # Render Static Site (React + Vite Frontend)
  - type: web
    name: cloudwatch-sentinel-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cloudwatch-sentinel-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
